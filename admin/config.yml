backend:
  name: github
  repo: satyateam7/satya-journeys
  branch: main
  base_url: https://satya-journeys-oauth.t7in007.workers.dev
  auth_endpoint: /auth

media_folder: "uploads"
public_folder: "/uploads"

site_url: https://satyajourneys.com
display_url: https://satyajourneys.com

publish_mode: simple

collections:
  - name: "destinations"
    label: "Destinations"
    folder: "content/destinations"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Country", name: "country", widget: "string" }
      - { label: "State / Region", name: "region", widget: "string", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Source type", name: "source_type", widget: "select", options: ["personal", "contributed", "research"], default: "personal" }
      - { label: "Source name", name: "source_name", widget: "string" }
      - { label: "Visit date", name: "visit_date", widget: "datetime", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }
      - { label: "Gallery", name: "gallery", widget: "list", required: false, fields: [{ label: "Image", name: "image", widget: "image" }, { label: "Alt text", name: "alt", widget: "string" }, { label: "Caption / story", name: "caption", widget: "text" }] }
      - { label: "Destination notes", name: "body", widget: "markdown" }

  - name: "stories"
    label: "Travel Stories"
    folder: "content/stories"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Source type", name: "source_type", widget: "select", options: ["Personal experience", "Friend or family contribution", "Joint journey", "Research-based"], default: "Personal experience" }
      - { label: "Source / contributor name", name: "source_name", widget: "string" }
      - { label: "Date of journey", name: "date", widget: "datetime", required: false }
      - { label: "Destination", name: "destination", widget: "string", required: false }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Video URL", name: "video_url", widget: "string", required: false }
      - { label: "Gallery", name: "gallery", widget: "list", required: false, fields: [{ label: "Image", name: "image", widget: "image" }, { label: "Alt text", name: "alt", widget: "string" }, { label: "Caption / story", name: "caption", widget: "text" }] }
      - { label: "Story", name: "body", widget: "markdown" }

  - name: "itineraries"
    label: "Itineraries"
    folder: "content/itineraries"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Duration", name: "duration", widget: "string" }
      - { label: "Travel mode", name: "travel_mode", widget: "select", options: ["Road trip", "Train", "Flight", "Mixed", "Other"] }
      - { label: "Source type", name: "source_type", widget: "select", options: ["Personal experience", "Friend or family contribution", "Joint journey", "Research-based"], default: "Personal experience" }
      - { label: "Source name", name: "source_name", widget: "string" }
      - { label: "Last verified", name: "last_verified", widget: "datetime", required: false }
      - { label: "Service providers", name: "providers", widget: "list", required: false }
      - { label: "Itinerary details", name: "body", widget: "markdown" }

  - name: "providers"
    label: "Service Providers"
    folder: "content/providers"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Provider name", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Service type", name: "service_type", widget: "select", options: ["Taxi / transport", "Accommodation", "Guide", "Activity", "Other"] }
      - { label: "Location / service area", name: "location", widget: "string" }
      - { label: "Public contact phone", name: "contact_phone", widget: "string", required: false }
      - { label: "Website / booking URL", name: "website", widget: "string", required: false }
      - { label: "Used by / source", name: "used_by", widget: "string" }
      - { label: "Verification status", name: "verification_status", widget: "string" }
      - { label: "Last verified", name: "last_verified", widget: "datetime", required: false }
      - { label: "Experience and provider notes", name: "body", widget: "markdown" }
